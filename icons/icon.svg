<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58cc02"/>
      <stop offset="100%" stop-color="#23a000"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffc800"/>
      <stop offset="100%" stop-color="#ff9600"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.2"/>
    </filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#79e218" stroke-width="8" opacity="0.6"/>

  <!-- Shadowed shield/book container -->
  <g filter="url(#shadow)">
    <!-- Central Badge -->
    <circle cx="256" cy="240" r="170" fill="url(#shieldGrad)"/>
    <circle cx="256" cy="240" r="156" fill="none" stroke="#e2e8f0" stroke-width="6"/>
  </g>

  <!-- Duolingo style Graduation Cap & English Book Icon -->
  <!-- Open Book Base -->
  <g transform="translate(146, 210) scale(0.9)">
    <!-- Left page -->
    <path d="M 120 120 C 70 95 20 100 0 115 L 0 15 C 20 0 70 -5 120 20 Z" fill="#3b82f6"/>
    <!-- Right page -->
    <path d="M 125 120 C 175 95 225 100 245 115 L 245 15 C 225 0 175 -5 125 20 Z" fill="#1d4ed8"/>
    <!-- Page lines left -->
    <line x1="25" y1="40" x2="95" y2="52" stroke="#93c5fd" stroke-width="6" stroke-linecap="round"/>
    <line x1="25" y1="65" x2="95" y2="77" stroke="#93c5fd" stroke-width="6" stroke-linecap="round"/>
    <!-- Page lines right -->
    <line x1="150" y1="52" x2="220" y2="40" stroke="#93c5fd" stroke-width="6" stroke-linecap="round"/>
    <line x1="150" y1="77" x2="220" y2="65" stroke="#93c5fd" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Graduation Mortarboard above -->
  <g filter="url(#innerGlow)">
    <!-- Cap Diamond -->
    <polygon points="256,120 370,165 256,210 142,165" fill="#1e293b"/>
    <!-- Cap top highlight -->
    <polygon points="256,128 354,165 256,202 158,165" fill="#334155"/>
    <!-- Cap Skull Base -->
    <path d="M 195 188 L 195 222 C 195 245 317 245 317 222 L 317 188 Z" fill="#0f172a"/>
    <!-- Tassel Button -->
    <circle cx="256" cy="165" r="9" fill="url(#goldGrad)"/>
    <!-- Tassel String & Fringe -->
    <path d="M 256 165 C 290 170 330 190 335 225 L 342 226 L 332 250 L 325 225 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Big English Flag Heart / A+ Star Badge -->
  <g transform="translate(256, 360)">
    <!-- Pill banner: 'SARA'S ENGLISH' -->
    <rect x="-130" y="-30" width="260" height="58" rx="29" fill="url(#goldGrad)" filter="url(#shadow)"/>
    <rect x="-126" y="-26" width="252" height="50" rx="25" fill="none" stroke="#fff" stroke-width="3" opacity="0.8"/>
    <text x="0" y="7" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">ENGLISH A+</text>
  </g>

  <!-- Sparkles -->
  <polygon points="120,110 125,125 140,130 125,135 120,150 115,135 100,130 115,125" fill="#ffc800"/>
  <polygon points="390,260 393,270 405,273 393,277 390,288 387,277 375,273 387,270" fill="#ffc800"/>
</svg>
